<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmaliTech GCA Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CodeMirror 5 — classic script tags, works in all sandboxes -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">

<style>
  :root {
    --bg-dark: #0d1117;
    --bg-panel: #161b22;
    --bg-editor: #0d1117;
    --bg-header: #1c2128;
    --bg-hover: #21262d;
    --border: #30363d;
    --accent: #f78166;
    --accent-orange: #e6863c;
    --accent-green: #3fb950;
    --accent-blue: #58a6ff;
    --accent-yellow: #e3b341;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --tab-active: #e6edf3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP NAV ── */
  .topnav {
    height: 48px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  .nav-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: var(--accent-orange); letter-spacing: -0.5px; }
  .logo span { color: var(--text-primary); }
  .q-pills { display: flex; gap: 6px; }
  .q-pill {
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); transition: all .15s;
  }
  .q-pill:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .q-pill.active { background: var(--accent-orange); border-color: var(--accent-orange); color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .timer {
    font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
    color: var(--accent-green); background: rgba(63,185,80,.1);
    padding: 4px 14px; border-radius: 6px; border: 1px solid rgba(63,185,80,.3);
    min-width: 90px; text-align: center;
  }
  .timer.warning { color: var(--accent-yellow); background: rgba(227,179,65,.1); border-color: rgba(227,179,65,.3); }
  .timer.danger  { color: var(--accent); background: rgba(247,129,102,.1); border-color: rgba(247,129,102,.3); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .btn {
    padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all .15s; font-family: 'IBM Plex Sans', sans-serif;
  }
  .btn-run { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-run:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .btn-submit { background: var(--accent-orange); color: #fff; }
  .btn-submit:hover { background: #d4762c; }

  /* ── MAIN SPLIT ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── PROBLEM PANEL ── */
  .problem-panel {
    width: 420px; min-width: 280px; max-width: 540px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--bg-panel);
    flex-shrink: 0;
  }
  .panel-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-header); }
  .ptab {
    padding: 10px 18px; font-size: 13px; font-weight: 500; cursor: pointer;
    color: var(--text-secondary); border-bottom: 2px solid transparent;
    transition: all .15s; user-select: none;
  }
  .ptab.active { color: var(--text-primary); border-bottom-color: var(--accent-orange); }
  .ptab:hover:not(.active) { color: var(--text-primary); }
  .problem-body { flex: 1; overflow-y: auto; padding: 24px; }
  .problem-body::-webkit-scrollbar { width: 6px; }
  .problem-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .problem-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .diff-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .diff-easy   { background: rgba(63,185,80,.15); color: var(--accent-green); }
  .diff-med    { background: rgba(227,179,65,.15); color: var(--accent-yellow); }
  .diff-hard   { background: rgba(247,129,102,.15); color: var(--accent); }

  .problem-desc { font-size: 14px; line-height: 1.75; color: var(--text-primary); margin-bottom: 20px; }
  .problem-desc code {
    background: var(--bg-dark); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--accent-blue); border: 1px solid var(--border);
  }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }
  .variants { list-style: none; margin-bottom: 20px; }
  .variants li {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    padding: 8px 12px; margin-bottom: 6px; background: var(--bg-dark);
    border: 1px solid var(--border); border-radius: 6px; color: #ffa657;
  }
  .example-block {
    background: var(--bg-dark); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; margin-bottom: 16px;
  }
  .example-block .ex-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .example-block pre { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-primary); white-space: pre-wrap; }
  .constraint-list { list-style: none; }
  .constraint-list li { font-size: 13px; padding: 4px 0; color: var(--text-secondary); display: flex; gap: 8px; align-items: flex-start; }
  .constraint-list li::before { content: '•'; color: var(--accent-orange); flex-shrink: 0; }

  /* ── RESIZER ── */
  .resizer { width: 4px; cursor: col-resize; background: var(--border); flex-shrink: 0; transition: background .15s; }
  .resizer:hover, .resizer.dragging { background: var(--accent-blue); }

  /* ── EDITOR PANEL ── */
  .editor-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .editor-header {
    height: 42px; background: var(--bg-header); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    flex-shrink: 0;
  }
  .file-tabs { display: flex; align-items: center; gap: 0; }
  .file-tab {
    padding: 0 16px; height: 42px; display: flex; align-items: center; gap: 8px;
    font-size: 13px; cursor: pointer; color: var(--text-secondary);
    border-bottom: 2px solid transparent; border-right: 1px solid var(--border);
    transition: all .15s; user-select: none;
  }
  .file-tab.active { color: var(--tab-active); border-bottom-color: var(--accent-orange); background: var(--bg-editor); }
  .file-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-orange); }
  .lang-select {
    background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-primary);
    padding: 4px 10px; border-radius: 6px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
  }
  .lang-select:focus { outline: none; border-color: var(--accent-blue); }

  /* ── CODEMIRROR 5 AREA ── */
  .editor-area {
    flex: 1;
    overflow: hidden;
    background: var(--bg-editor);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .CodeMirror {
    flex: 1;
    height: 100% !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 14px !important;
    line-height: 1.6 !important;
    background: var(--bg-editor) !important;
    color: var(--text-primary) !important;
  }
  .CodeMirror-scroll { height: 100% !important; }
  .CodeMirror-gutters {
    background: var(--bg-editor) !important;
    border-right: 1px solid var(--border) !important;
  }
  .CodeMirror-linenumber { color: var(--text-muted) !important; }
  .CodeMirror-activeline-background { background: rgba(88,166,255,.05) !important; }
  .CodeMirror-cursor { border-left: 2px solid var(--accent-orange) !important; }
  .CodeMirror-selected { background: rgba(88,166,255,.2) !important; }
  .CodeMirror-focused .CodeMirror-selected { background: rgba(88,166,255,.25) !important; }
  .CodeMirror-matchingbracket { background: rgba(88,166,255,.18) !important; outline: 1px solid rgba(88,166,255,.5) !important; color: inherit !important; }

  /* Dracula theme overrides to match our palette */
  .cm-s-dracula .CodeMirror-gutters { background: var(--bg-editor) !important; }
  .cm-s-dracula.CodeMirror { background: var(--bg-editor) !important; }

  /* Error status bar */
  .error-statusbar {
    height: 24px; background: var(--bg-header); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 12px; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
  }
  .error-count { display: flex; align-items: center; gap: 4px; }
  .error-count.has-errors { color: var(--accent); }
  .error-count.has-warnings { color: var(--accent-yellow); }
  .status-lang { margin-left: auto; color: var(--text-muted); }

  /* ── OUTPUT PANEL ── */
  .output-panel {
    height: 200px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
    background: var(--bg-panel);
  }
  .output-header {
    height: 38px; background: var(--bg-header); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    flex-shrink: 0;
  }
  .output-tabs { display: flex; gap: 0; }
  .otab {
    padding: 0 16px; height: 38px; display: flex; align-items: center;
    font-size: 13px; cursor: pointer; color: var(--text-secondary);
    border-bottom: 2px solid transparent; transition: all .15s;
  }
  .otab.active { color: var(--text-primary); border-bottom-color: var(--accent-orange); }
  .output-actions { display: flex; gap: 8px; }
  .output-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .output-body::-webkit-scrollbar { width: 6px; }
  .output-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .output-empty { color: var(--text-muted); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .test-case {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .test-case:last-child { border-bottom: none; }
  .tc-info { flex: 1; }
  .tc-name { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
  .tc-detail { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); font-size: 12px; }

  /* ── PROBLEM NAV ── */
  .problem-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg-header); }
  .nav-btn { background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-secondary); padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: all .15s; }
  .nav-btn:hover { color: var(--text-primary); border-color: var(--accent-blue); }
  .prob-counter { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  .score-bar { display: flex; gap: 6px; align-items: center; }
  .score-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
  .score-dot.done { background: var(--accent-green); }
  .score-dot.current { background: var(--accent-orange); }

  /* Lint underlines via CM5 gutter */
  .CodeMirror-lint-marker-error { color: var(--accent) !important; }
  .CodeMirror-lint-marker-warning { color: var(--accent-yellow) !important; }
  .CodeMirror-lint-line-error { background: rgba(247,129,102,.05) !important; }
  .CodeMirror-lint-line-warning { background: rgba(227,179,65,.04) !important; }

  /* ── TERMINAL OUTPUT ── */
  .terminal-body {
    flex: 1; overflow-y: auto; padding: 0;
    background: #0a0c10;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.55;
  }
  .terminal-body::-webkit-scrollbar { width: 6px; }
  .terminal-body::-webkit-scrollbar-thumb { background: #2a2f38; border-radius: 3px; }
  .term-line { padding: 1px 16px; white-space: pre-wrap; word-break: break-all; }
  .term-line.term-prompt { color: #4a9eff; }
  .term-line.term-pass  { color: #3fb950; }
  .term-line.term-fail  { color: #f78166; }
  .term-line.term-warn  { color: #e3b341; }
  .term-line.term-muted { color: #484f58; }
  .term-line.term-info  { color: #8b949e; }
  .term-line.term-white { color: #e6edf3; }
  .term-line.term-error-detail { color: #ff8080; padding-left: 32px; }
  .term-separator { height: 1px; background: #1c2128; margin: 6px 0; }
  .term-summary {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: #0d1117;
    border-bottom: 1px solid #1c2128;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .term-cursor { display: inline-block; width: 7px; height: 13px; background: var(--accent-orange); animation: blink .9s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── HINT BUTTON ── */
  .btn-hint {
    background: transparent; color: var(--accent-yellow);
    border: 1px solid rgba(227,179,65,.4); padding: 5px 12px;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all .15s; font-family: 'IBM Plex Sans', sans-serif;
    display: flex; align-items: center; gap: 5px;
  }
  .btn-hint:hover { background: rgba(227,179,65,.1); border-color: var(--accent-yellow); }
  .hint-panel {
    margin: 0 0 16px 0; background: rgba(227,179,65,.07);
    border: 1px solid rgba(227,179,65,.25); border-radius: 8px;
    padding: 14px; display: none;
  }
  .hint-panel.visible { display: block; }
  .hint-panel .hint-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-yellow); margin-bottom: 8px; }
  .hint-panel .hint-steps { list-style: none; }
  .hint-panel .hint-steps li { font-size: 13px; color: var(--text-secondary); padding: 4px 0; display: flex; gap: 8px; }
  .hint-panel .hint-steps li::before { content: '→'; color: var(--accent-yellow); flex-shrink: 0; }

  /* ── SOLUTION REVEAL PANEL ── */
  .btn-solution {
    background: transparent; color: var(--accent-blue);
    border: 1px solid rgba(88,166,255,.35); padding: 5px 12px;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all .15s; font-family: 'IBM Plex Sans', sans-serif;
    display: flex; align-items: center; gap: 5px; margin-left: 6px;
  }
  .btn-solution:hover { background: rgba(88,166,255,.1); border-color: var(--accent-blue); }
  .btn-solution.active { background: rgba(88,166,255,.15); border-color: var(--accent-blue); color: var(--accent-blue); }

  .solution-panel {
    margin: 0 0 16px 0;
    background: rgba(13,17,23,.9);
    border: 1px solid rgba(88,166,255,.3);
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .solution-panel.visible { display: block; }
  .solution-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: rgba(88,166,255,.07);
    border-bottom: 1px solid rgba(88,166,255,.15);
  }
  .solution-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--accent-blue);
  }
  .solution-progress {
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
  }
  .solution-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.65;
    padding: 12px 14px;
    margin: 0;
    white-space: pre;
    overflow-x: auto;
    min-height: 32px;
    background: transparent;
    color: var(--text-primary);
  }
  .solution-code .sol-line {
    display: block;
    animation: lineReveal .18s ease-out both;
  }
  @keyframes lineReveal {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  /* Syntax colouring (lightweight, no library needed) */
  .sol-kw   { color: #ff79c6; }  /* keywords */
  .sol-type { color: #8be9fd; }  /* types */
  .sol-fn   { color: #50fa7b; }  /* method names */
  .sol-num  { color: #bd93f9; }  /* numbers */
  .sol-str  { color: #f1fa8c; }  /* strings */
  .sol-cmt  { color: #6272a4; font-style: italic; }  /* comments */
  .sol-pkg  { color: #ffb86c; }  /* package/class */
  .sol-op   { color: #ff79c6; }  /* operators */

  .solution-actions {
    display: flex; gap: 8px; padding: 8px 14px;
    border-top: 1px solid rgba(88,166,255,.1);
    background: rgba(88,166,255,.03);
  }
  .sol-btn {
    padding: 4px 12px; border-radius: 5px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--bg-hover); color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif; transition: all .15s;
  }
  .sol-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .sol-btn.primary { background: rgba(88,166,255,.15); border-color: rgba(88,166,255,.4); color: var(--accent-blue); }
  .sol-btn.primary:hover { background: rgba(88,166,255,.25); }
  .sol-btn.danger { border-color: rgba(247,129,102,.3); color: var(--accent); }
  .sol-btn.danger:hover { background: rgba(247,129,102,.1); }
</style>
</head>
<body>

<!-- PYODIDE STATUS BANNER -->
<div id="pyBanner" style="background:#1c2128;border-bottom:1px solid #30363d;padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:#8b949e;">
  <span id="pyStatus" style="color:#e3b341;">⏳ Loading Python runtime…</span>
  <span style="color:#484f58;" id="pySubtext">JavaScript runs instantly · Python loads on first use · Java/C++ use smart static evaluation</span>
</div>

<!-- TOP NAV -->
<nav class="topnav">
  <div class="nav-left">
    <div class="logo">AmaliTech<span>.prep</span></div>
    <div class="q-pills" id="qpills"></div>
  </div>
  <div class="nav-right">
    <div class="score-bar" id="scorebar"></div>
    <div class="timer" id="timer">01:10:00</div>
    <button class="btn btn-run" id="btnRun">▶ Run</button>
  </div>
</nav>

<!-- MAIN -->
<div class="main">

  <!-- PROBLEM PANEL -->
  <div class="problem-panel" id="problemPanel">
    <div class="panel-tabs" style="justify-content:space-between;">
      <div style="display:flex;">
        <div class="ptab active" id="ptabDesc">Description</div>

// ── LINTING (CM5 compatible) ──────────────────────────────────────────────
function getLintErrors(code, lang) {
  const diagnostics = [];
  if (lang === 'java' || lang === 'cpp' || lang === 'javascript') {
    lintBraces(code, diagnostics);
  }
  if (lang === 'java' || lang === 'cpp') {
    lintSemicolons(code, diagnostics, lang);
  }
  if (lang === 'python') {
    lintPython(code, diagnostics);
  }
  if (lang === 'javascript') {
    lintJSSemicolons(code, diagnostics);
  }
  lintTodo(code, diagnostics, lang);
  return diagnostics;
}

function lintBraces(code, diags) {
  const stack = [];
  const opens = { '{': '}', '(': ')', '[': ']' };
  const closes = new Set(['}', ')', ']']);
  let inStr = false, inCh = false, inLC = false, inBC = false;
  const lines = code.split('\n');
  let absPos = 0;

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    for (let ci = 0; ci < line.length; ci++) {
      const ch = line[ci], prev = ci > 0 ? line[ci-1] : '';
      if (!inStr && !inCh && !inBC && ch === '/' && line[ci+1] === '/') { inLC = true; break; }
      if (!inStr && !inCh && ch === '/' && line[ci+1] === '*') { inBC = true; ci++; continue; }
      if (inBC && ch === '*' && line[ci+1] === '/') { inBC = false; ci++; continue; }
      if (inBC) continue;
      if (!inCh && ch === '"' && prev !== '\\') { inStr = !inStr; continue; }
      if (!inStr && ch === "'" && prev !== '\\') { inCh = !inCh; continue; }
      if (inStr || inCh) continue;
      if (opens[ch]) stack.push({ ch, li, ci: absPos + ci });
      else if (closes.has(ch)) {
        if (stack.length === 0) {
          diags.push({ from: { line: li, ch: ci }, to: { line: li, ch: ci+1 }, message: `Unexpected '${ch}' — no matching opening bracket`, severity: 'error' });
        } else {
          const top = stack[stack.length-1];
          if (opens[top.ch] === ch) stack.pop();
          else { diags.push({ from: { line: li, ch: ci }, to: { line: li, ch: ci+1 }, message: `Mismatched bracket: expected '${opens[top.ch]}' but got '${ch}'`, severity: 'error' }); stack.pop(); }
        }
      }
    }
    inLC = false;
    absPos += line.length + 1;
  }
  for (const { ch, li, ci } of stack) {
    diags.push({ from: { line: li, ch: 0 }, to: { line: li, ch: 1 }, message: `Unclosed '${ch}' — missing closing bracket`, severity: 'error' });
  }
}

function lintSemicolons(code, diags, lang) {
  const lines = code.split('\n');
  lines.forEach((line, li) => {
    const t = line.trim();
    if (!t || t.startsWith('//') || t.startsWith('*') || t.startsWith('/*') || t.startsWith('@') || t.startsWith('#')) return;
    const needs = /^(return|int |long |double |float |boolean |String |char |var |auto |throw |break|continue|[a-zA-Z_]\w*\s*[\+\-\*\/]?=)/.test(t);
    const ok = t.endsWith(';') || t.endsWith('{') || t.endsWith('}') || t.endsWith(',') || t.endsWith('(') || t.endsWith(')') || t.includes('//');
    if (needs && !ok && t.length > 2) {
      diags.push({ from: { line: li, ch: line.length - 1 }, to: { line: li, ch: line.length }, message: 'Missing semicolon at end of statement', severity: 'error' });
    }
  });
}

function lintJSSemicolons(code, diags) {
  const lines = code.split('\n');
  lines.forEach((line, li) => {
    const t = line.trim();
    if (!t || t.startsWith('//')) return;
    const needs = /^(return|let |const |var |throw |break|continue|[a-zA-Z_$][\w$]*\s*[\+\-\*\/]?=(?!=))/.test(t);
    const ok = t.endsWith(';') || t.endsWith('{') || t.endsWith('}') || t.endsWith(',');
    if (needs && !ok && t.length > 2) {
      diags.push({ from: { line: li, ch: line.length - 1 }, to: { line: li, ch: line.length }, message: 'Missing semicolon (style warning)', severity: 'warning' });
    }
  });
}

function lintPython(code, diags) {
  const lines = code.split('\n');
  lines.forEach((line, li) => {
    const t = line.trim();
    if (/^(def |class )\w/.test(t) && !t.endsWith(':') && !t.includes('#')) {
      diags.push({ from: { line: li, ch: 0 }, to: { line: li, ch: line.length }, message: `Missing ':' at end of ${t.startsWith('def') ? 'function' : 'class'} definition`, severity: 'error' });
    }
    if (line.startsWith('\t') && line.includes('    ')) {
      diags.push({ from: { line: li, ch: 0 }, to: { line: li, ch: 1 }, message: 'Mixed tabs and spaces', severity: 'warning' });
    }
  });
}

function lintTodo(code, diags, lang) {
  const markers = lang === 'python' ? ['# write your code here', 'pass'] : ['// write your code here', '// TODO'];
  code.split('\n').forEach((line, li) => {
    if (markers.some(m => line.trim() === m)) {
      diags.push({ from: { line: li, ch: 0 }, to: { line: li, ch: line.length }, message: 'Not implemented yet', severity: 'warning' });
    }
  });
}

// ── CODEMIRROR 5 SETUP ────────────────────────────────────────────────────
function createEditor(content, lang) {
  const mount = document.getElementById('editorMount');
  // Destroy old instance
  if (cmEditor) { cmEditor.toTextArea(); cmEditor = null; }
  mount.innerHTML = '';

  const ta = document.createElement('textarea');
  mount.appendChild(ta);

  cmEditor = CodeMirror.fromTextArea(ta, {
    value: content,
    mode: langModes[lang] || 'text/x-java',
    theme: 'dracula',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter', 'CodeMirror-lint-markers'],
    lint: {
      getAnnotations: (text) => getLintErrors(text, lang),
      async: false,
    },
    extraKeys: {
      'Tab': (cm) => cm.execCommand('indentMore'),
      'Shift-Tab': (cm) => cm.execCommand('indentLess'),
      'Ctrl-/': (cm) => cm.execCommand('toggleComment'),
      'Cmd-/': (cm) => cm.execCommand('toggleComment'),
    },
  });

  cmEditor.setValue(content);

  // Fit to container
  cmEditor.setSize('100%', '100%');

  // Cursor position tracking
  cmEditor.on('cursorActivity', () => {
    const cursor = cmEditor.getCursor();
    const el = document.getElementById('cursorPos');
    if (el) el.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
  });

  // Lint status update on change
  cmEditor.on('change', () => {
    setTimeout(() => {
      const code = cmEditor.getValue();
      const diags = getLintErrors(code, lang);
      const errors = diags.filter(d => d.severity === 'error').length;
      const warnings = diags.filter(d => d.severity === 'warning').length;
      updateErrorStatus(errors, warnings);
    }, 400);
  });

  document.getElementById('statusLang').textContent = langNames[lang] || lang;
}

function getEditorContent() {
  return cmEditor ? cmEditor.getValue() : '';
}

// ── ERROR STATUS ──────────────────────────────────────────────────────────
function updateErrorStatus(errors, warnings) {
  const el = document.getElementById('errorCount');
  if (!el) return;
  if (errors > 0) {
    el.className = 'error-count has-errors';
    el.textContent = `✗ ${errors} error${errors > 1 ? 's' : ''}${warnings > 0 ? `, ${warnings} warning${warnings > 1 ? 's' : ''}` : ''}`;
  } else if (warnings > 0) {
    el.className = 'error-count has-warnings';
    el.textContent = `⚠ ${warnings} warning${warnings > 1 ? 's' : ''}`;
  } else {
    el.className = 'error-count';
    el.textContent = '✓ No errors';
  }
}

      <button class="sol-btn primary" id="solNextBtn" onclick="revealNextLine()">▶ Next Line</button>
      <button class="sol-btn" onclick="revealAllLines()">⏩ Show All</button>
      <button class="sol-btn danger" onclick="resetSolution()">↺ Reset</button>
    </div>
  </div>`;
  document.getElementById('problemBody').innerHTML = html;
}

// ── TIMER ─────────────────────────────────────────────────────────────────
function startTimer() {
  timerInterval = setInterval(() => {
    totalSeconds--;
    if (totalSeconds <= 0) { clearInterval(timerInterval); totalSeconds = 0; }
    const el = document.getElementById('timer');
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    el.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    el.className = 'timer';
    if (totalSeconds < 600) el.classList.add('danger');
    else if (totalSeconds < 1200) el.classList.add('warning');
  }, 1000);
}
function pad(n) { return String(n).padStart(2, '0'); }

// ── LANG SWITCH ───────────────────────────────────────────────────────────
function switchLang(lang) {
  codes[starterKey(currentProblem, currentLang)] = getEditorContent();
  currentLang = lang;
  document.getElementById('filename').textContent = langFiles[lang];
  document.getElementById('statusLang').textContent = langNames[lang];
  const saved = codes[starterKey(currentProblem, lang)];
  const content = saved !== undefined ? saved : buildEditorContent(currentProblem, lang);
  createEditor(content, lang);
  // Kick off Pyodide load in background when Python is selected
  if (lang === 'python' && pyodideState === 'idle') ensurePyodide();
}

// ── PYODIDE — lazy load on first Python run ───────────────────────────────
let pyodideState = 'idle'; // idle | loading | ready | failed
let pyodideInstance = null;
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js';

// Hide banner immediately — it will reappear if Python is selected
document.getElementById('pyBanner').style.display = 'none';

async function ensurePyodide() {
  if (pyodideState === 'ready') return true;
  if (pyodideState === 'failed') return false;
  if (pyodideState === 'loading') {
    // Wait for ongoing load
    return new Promise(resolve => {
      const poll = setInterval(() => {
        if (pyodideState === 'ready') { clearInterval(poll); resolve(true); }
        if (pyodideState === 'failed') { clearInterval(poll); resolve(false); }
      }, 200);
    });
  }

  pyodideState = 'loading';
  const banner = document.getElementById('pyBanner');
  banner.style.display = 'flex';
  document.getElementById('pyStatus').style.color = '#e3b341';
  document.getElementById('pyStatus').textContent = '⏳ Loading Python runtime (Pyodide)…';

  try {
    // Dynamically inject the script
    await new Promise((resolve, reject) => {
      if (typeof loadPyodide !== 'undefined') { resolve(); return; }
      const s = document.createElement('script');
      s.src = PYODIDE_URL;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    pyodideInstance = await loadPyodide();
    pyodideState = 'ready';
    document.getElementById('pyStatus').style.color = 'var(--accent-green)';
    document.getElementById('pyStatus').textContent = '✓ Python runtime ready';
    setTimeout(() => { banner.style.display = 'none'; }, 2000);
    return true;
  } catch(e) {
    pyodideState = 'failed';
    document.getElementById('pyStatus').style.color = 'var(--accent)';
    document.getElementById('pyStatus').textContent = '⚠ Python runtime unavailable in this environment';
    document.getElementById('pySubtext').innerHTML =
      'Save the file and open it locally (<code style="font-family:monospace;color:#58a6ff">file://</code>) for full Python support · JS and Java/C++ work here';
    return false;
  }
}

// ── RUN ───────────────────────────────────────────────────────────────────
async function runCode() {
  const outputBody = document.getElementById('outputBody');
  const code = getEditorContent();
  const p = problems[currentProblem];
  outputBody.innerHTML = `<span class="output-empty" style="color:var(--accent-yellow)">⏳ Running your code...</span>`;

  if (currentLang === 'python') {
    await runPython(code, p, outputBody);
  } else if (currentLang === 'javascript') {
    runJavaScript(code, p, outputBody);
  } else {
    runStaticAnalysis(code, p, outputBody, currentLang);
  }
}

// ── PYTHON via Pyodide ────────────────────────────────────────────────────
async function runPython(code, p, outputBody) {
  const ready = await ensurePyodide();
  if (!ready) {
    outputBody.innerHTML = `<div style="padding:12px;background:var(--bg-dark);border-radius:8px;border:1px solid var(--border)">
      <div style="color:var(--accent-yellow);font-weight:600;margin-bottom:8px">⚠ Python runtime unavailable here</div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.6">
        The Pyodide CDN is blocked in this preview environment.<br>
        <strong style="color:var(--text-primary)">To run Python:</strong> download the file and open it directly in your browser (<code style="background:var(--bg-header);padding:1px 5px;border-radius:3px;color:var(--accent-blue)">file://</code>), or switch to <strong style="color:var(--text-primary)">JavaScript</strong> — it runs instantly.
      </div>
    </div>`;
    return;
  }
  const results = [];
  for (const tc of p.tests) {
    try {
      // Build a runnable snippet: inject the user's function then call it with parsed args
      const call = buildPythonCall(p, tc);
      const fullCode = code + '\n\n_result = ' + call;
      pyodideInstance.runPython(fullCode);
      const actual = String(pyodideInstance.globals.get('_result'));
      results.push({ name: tc.name, status: actual === tc.expected ? 'pass' : 'fail', expected: tc.expected, actual });
    } catch(e) {
      results.push({ name: tc.name, status: 'fail', expected: tc.expected, actual: '—', error: e.message.split('\n').pop() });
    }
  }
  renderTestResults(results);
}

function buildPythonCall(p, tc) {
  // Derive function name from starter
  const fnMatch = p.starterPython.match(/^def (\w+)\(/m);
  const fn = fnMatch ? fnMatch[1] : 'solve';
  // Parse input string like "a=2, b=3, c=4" or 's="abc"' or "N=9" or "A=[2,3,1,5]"
  return `${fn}(${tc.input})`;
}

// ── JAVASCRIPT via eval() ─────────────────────────────────────────────────
function runJavaScript(code, p, outputBody) {
  const results = [];
  for (const tc of p.tests) {
    try {
      const fnMatch = p.starterJs.match(/^function (\w+)\(/m);
      const fn = fnMatch ? fnMatch[1] : 'solve';
      const runnable = code + `\n__result = ${fn}(${tc.input});`;
      let __result;
      // eslint-disable-next-line no-new-func
      (new Function('__result', runnable)).call({ __result: undefined });
      // Use indirect eval to capture return
      const evalCode = code + `\n(${fn}(${tc.input}))`;
      const actual = String(eval(evalCode));
      results.push({ name: tc.name, status: actual === tc.expected ? 'pass' : 'fail', expected: tc.expected, actual });
    } catch(e) {
      results.push({ name: tc.name, status: 'fail', expected: tc.expected, actual: '—', error: e.message });
    }
  }
  renderTestResults(results);
}

// ── JAVA / C++ — static analysis ──────────────────────────────────────────
function runStaticAnalysis(code, p, outputBody, lang) {
  const results = [];
  const trimmed = code.trim();

  // Detect if the body is still the starter (unimplemented):
  // strip all single-line comments, then check if there's no return statement
  const strippedComments = trimmed.replace(/\/\/[^\n]*/g, '');
  const isUnimplemented = !/return\s+\S/.test(strippedComments);

  if (isUnimplemented) {
    p.tests.forEach(tc => results.push({ name: tc.name, status: 'pending', expected: tc.expected, actual: 'not implemented', error: null }));
    renderTestResults(results);
    return;
  }

  // Check for syntax issues via linter
  const diags = getLintErrors(trimmed, lang);
  const errors = diags.filter(d => d.severity === 'error');
  if (errors.length > 0) {
    p.tests.forEach(tc => results.push({
      name: tc.name, status: 'fail', expected: tc.expected, actual: '—',
      error: `Line ${errors[0].from.line + 1}: ${errors[0].message}`
    }));
    renderTestResults(results);
    return;
  }

  // Try to evaluate each problem with known patterns
  p.tests.forEach(tc => {
    try {
      const actual = evaluateStatically(p, tc, trimmed, lang);
      if (actual === null) {
        results.push({ name: tc.name, status: 'pending', expected: tc.expected, actual: 'needs runtime' });
      } else {
        results.push({ name: tc.name, status: String(actual) === tc.expected ? 'pass' : 'fail', expected: tc.expected, actual: String(actual) });
      }
    } catch(e) {
      results.push({ name: tc.name, status: 'fail', expected: tc.expected, actual: '—', error: e.message });
    }
  });
  renderTestResults(results);
}

// Extract the innermost method body using brace matching (returns {name, params, body})
function extractMethod(code) {
  // Find the method signature — the first function-like pattern NOT preceded by class/if/for/while
  const sigRe = /\b(\w+)\s*\(([^)]*)\)\s*\{/g;
  const skip = new Set(['if','for','while','switch','catch','class','do','else']);
  let match;
  while ((match = sigRe.exec(code)) !== null) {
    const name = match[1];
    if (skip.has(name)) continue;
    // Walk from the opening brace to find the matching closing brace
    const start = match.index + match[0].length - 1; // position of '{'
    let depth = 0, i = start;
    for (; i < code.length; i++) {
      if (code[i] === '{') depth++;
      else if (code[i] === '}') { depth--; if (depth === 0) break; }
    }
    return { name, params: match[2], body: code.slice(start + 1, i) };
  }
  return null;
}

// Evaluate known problem patterns statically by transpiling to JS
function evaluateStatically(p, tc, code, lang) {
  // Normalise Java/C++ types to JS-compatible syntax first
  let src = code
    .replace(/\(long\)\s*/g, '')
    .replace(/\(int\)\s*/g, '')
    .replace(/\bpublic\s+/g, '')
    .replace(/\bprivate\s+/g, '')
    .replace(/\bprotected\s+/g, '')
    .replace(/\bstatic\s+/g, '')
    .replace(/\bfinal\s+/g, '')
    .replace(/\blong long\b/g, 'var')
    .replace(/\b(int|long|double|float|boolean|String|char|auto|vector<int>|vector<long long>|vector<long>|int\[\]|long\[\])\s+/g, 'var ')
    .replace(/\bstring\s+/g, 'var ')
    .replace(/\bstd::/g, '')
    .replace(/Integer\.toBinaryString\(/g, '(n => n.toString(2))(')
    .replace(/Integer\.parseInt\(/g, 'parseInt(')
    .replace(/Long\.parseLong\(/g, 'parseInt(')
    .replace(/\.length\(\)/g, '.length')
    .replace(/nullptr/g, 'null');

  const m = extractMethod(src);
  if (!m) return null;
  if (['if','for','while','switch','class'].includes(m.name)) return null;

  // Clean param list — strip type annotations, [], &
  const paramList = m.params
    .replace(/var\s+/g, '')
    .replace(/\[\]/g, '')
    .replace(/&/g, '')
    .trim();

  const jsCode = `function ${m.name}(${paramList}) {${m.body}}`;

  // Parse test input — strip named-arg labels like "a=2, b=3" → "2, 3"
  // but keep array literals like "A=[2,3,1,5]" → "[2,3,1,5]"
  const rawInput = tc.input.replace(/[a-zA-Z_]\w*\s*=\s*/g, '');
  const callExpr = `${m.name}(${rawInput})`;
  try {
    const result = eval(jsCode + '\n' + callExpr);
    // Convert BigInt or large number to string properly
    if (typeof result === 'bigint') return String(result);
    return result;
  } catch(e) {
    // Return the error message so the terminal can show it
    throw new Error(e.message);
  }
}

function renderTestResults(results) {
  const outputBody = document.getElementById('outputBody');
  const pass = results.filter(r => r.status === 'pass').length;
  const total = results.length;

  if (pass === total && total > 0 && results.every(r => r.status === 'pass')) {
    completed.add(currentProblem);
    renderScorebar();
  }

  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const p = problems[currentProblem];
  let html = '';

  // Header line
  html += `<div class="term-line term-prompt" style="padding-top:10px;">$ run ${langFiles[currentLang]}  <span style="color:var(--text-muted);">[${ts}]</span></div>`;
  html += `<div class="term-line term-info">  Problem: Q${currentProblem+1}. ${p.title} | Lang: ${langNames[currentLang]}</div>`;
  html += `<div class="term-separator"></div>`;

  results.forEach((r, idx) => {
    const statusSymbol = r.status === 'pass' ? '✓ PASS' : r.status === 'fail' ? '✗ FAIL' : '○ SKIP';
    const cls = r.status === 'pass' ? 'term-pass' : r.status === 'fail' ? 'term-fail' : 'term-muted';

    html += `<div class="term-line ${cls}">  [${idx+1}/${total}] ${statusSymbol}  ${r.name}</div>`;
    html += `<div class="term-line term-info">         Expected : ${r.expected}</div>`;

    if (r.status === 'pending' || r.actual === 'not implemented') {
      html += `<div class="term-line term-warn">         Got      : <span style="color:#e3b341;">not implemented</span></div>`;
      html += `<div class="term-line term-warn">         ⚠ Add your return statement — method body is empty.</div>`;
    } else {
      html += `<div class="term-line ${r.status==='pass'?'term-pass':'term-fail'}">         Got      : ${r.actual || '—'}</div>`;
    }

    if (r.error) {
      // Format error nicely
      const errLines = r.error.split('\n');
      html += `<div class="term-line term-fail">         Error    : ${errLines[0]}</div>`;
      for (let i = 1; i < Math.min(errLines.length, 4); i++) {
        if (errLines[i].trim()) html += `<div class="term-line term-error-detail">${errLines[i]}</div>`;
      }
    }

    if (idx < results.length - 1) html += `<div class="term-separator"></div>`;
  });

  html += `<div class="term-separator"></div>`;

  // Summary line
  const allPass = pass === total && total > 0;
  const summaryColor = allPass ? 'var(--accent-green)' : pass > 0 ? 'var(--accent-yellow)' : 'var(--accent)';
  const summaryIcon = allPass ? '✓' : '✗';
  html += `<div class="term-line" style="color:${summaryColor};font-weight:700;padding-bottom:6px;">  ${summaryIcon} ${pass}/${total} tests passed${allPass ? ' — All tests passed! 🎉' : ''}</div>`;
  html += `<div class="term-line term-muted">$ <span class="term-cursor"></span></div>`;

  outputBody.innerHTML = html;

  // Update badge
  const badge = document.getElementById('termSummaryBadge');
  if (badge) badge.textContent = `${pass}/${total} passed`;
  badge.style.color = allPass ? 'var(--accent-green)' : pass > 0 ? 'var(--accent-yellow)' : 'var(--accent)';
}



// ── SOLUTION REVEAL ──────────────────────────────────────────────────────
let solLinesRevealed = 0;
let solLines = [];

function getSolutionLines() {
  const p = problems[currentProblem];
  const raw = (p.solutionJava || '').replace(/\\n/g, '\n');
  return raw.split('\n');
}

function toggleSolution() {
  const panel = document.getElementById('solutionPanel');
  const btn = document.getElementById('btnSolution');
  if (!panel) return;
  if (!panel.classList.contains('visible')) {
    // Warn on first open
    if (solLinesRevealed === 0) {
      solLines = getSolutionLines();
    }
    panel.classList.add('visible');
    btn.classList.add('active');
    btn.textContent = '🙈 Hide Solution';
  } else {
    panel.classList.remove('visible');
    btn.classList.remove('active');
    btn.textContent = '👁 Solution';
  }
}

function syntaxHighlight(line) {
  // Plain text only — just escape HTML, no span injection
  return (line
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')) || ' ';
}

function renderSolutionLines() {
  const codeEl = document.getElementById('solCode');
  const progEl = document.getElementById('solProgress');
  const nextBtn = document.getElementById('solNextBtn');
  if (!codeEl) return;

  codeEl.innerHTML = solLines.slice(0, solLinesRevealed)
    .map((line, i) => `<span class="sol-line">${syntaxHighlight(line) || ' '}</span>`)
    .join('\n');

  if (progEl) progEl.textContent = `${solLinesRevealed} / ${solLines.length} lines`;
  if (nextBtn) {
    if (solLinesRevealed >= solLines.length) {
      nextBtn.textContent = '✓ All revealed';
      nextBtn.disabled = true;
      nextBtn.style.opacity = '0.5';
    } else {
      nextBtn.textContent = '▶ Next Line';
      nextBtn.disabled = false;
      nextBtn.style.opacity = '1';
    }
  }
}

function revealNextLine() {
  if (solLines.length === 0) solLines = getSolutionLines();
  if (solLinesRevealed < solLines.length) {
    solLinesRevealed++;
    renderSolutionLines();
    // Auto-scroll solution code to bottom
    const codeEl = document.getElementById('solCode');
    if (codeEl) codeEl.scrollTop = codeEl.scrollHeight;
  }
}

function revealAllLines() {
  if (solLines.length === 0) solLines = getSolutionLines();
  solLinesRevealed = solLines.length;
  renderSolutionLines();
}

function resetSolution() {
  solLinesRevealed = 0;
  solLines = getSolutionLines();
  renderSolutionLines();
  const nextBtn = document.getElementById('solNextBtn');
  if (nextBtn) { nextBtn.disabled = false; nextBtn.style.opacity = '1'; nextBtn.textContent = '▶ Next Line'; }
}

// ── HINT ──────────────────────────────────────────────────────────────────
let hintRevealed = 0; // how many hints shown for current problem

function toggleHint() {
  const panel = document.getElementById('hintPanel');
  if (!panel) return;
  const p = problems[currentProblem];
  const hints = p.hints || [];
  if (!panel.classList.contains('visible')) {
    panel.classList.add('visible');
    hintRevealed = Math.max(hintRevealed, 1);
    renderHints(hints);
  } else {
    // Reveal next hint
    if (hintRevealed < hints.length) {
      hintRevealed++;
      renderHints(hints);
    } else {
      panel.classList.remove('visible');
      hintRevealed = 0;
    }
  }
  // Update button label
  const btn = document.getElementById('btnHint');
  if (panel.classList.contains('visible')) {
    btn.textContent = hintRevealed < hints.length ? `💡 Next Hint (${hintRevealed}/${hints.length})` : '🙈 Hide Hints';
  } else {
    btn.textContent = '💡 Hint';
  }
}

function renderHints(hints) {
  const panel = document.getElementById('hintPanel');
  if (!panel) return;
  let html = `<div class="hint-label">💡 Hints (${hintRevealed}/${hints.length} revealed)</div><ul class="hint-steps">`;
  for (let i = 0; i < hintRevealed; i++) {
    html += `<li>${hints[i]}</li>`;
  }
  html += `</ul>`;
  if (hintRevealed < hints.length) {
    html += `<div style="font-size:11px;color:var(--text-muted);margin-top:8px;">Click Hint again to reveal the next hint.</div>`;
  }
  panel.innerHTML = html;
}
function prevProblem() { if (currentProblem > 0) loadProblem(currentProblem - 1); }
function nextProblem() { if (currentProblem < problems.length - 1) loadProblem(currentProblem + 1); }

function switchPTab(el, mode) {
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (mode === 'notes') {
    document.getElementById('problemBody').innerHTML = `
      <div class="problem-title">Notes — Q${currentProblem+1}</div>
      <textarea style="width:100%;height:calc(100vh - 220px);background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);padding:14px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.7;resize:none;outline:none;" placeholder="Write your notes, approach, pseudocode here..." id="notesArea">${notes[currentProblem] || ''}</textarea>`;
    document.getElementById('notesArea').addEventListener('input', e => { notes[currentProblem] = e.target.value; });
  } else {
    renderProblem(currentProblem);
  }
}

function switchOTab(el, mode) {
  document.querySelectorAll('.otab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  outputMode = mode;
}

function clearOutputView() {
  const badge = document.getElementById('termSummaryBadge');
  if (badge) badge.textContent = '';
  document.getElementById('outputBody').innerHTML =
    `<div class="term-line term-muted" style="padding-top:10px;">AmaliTech Prep — ready. Press <span style="color:var(--accent-blue)">Run</span> to execute your code.</div>
     <div class="term-line term-muted">$ <span class="term-cursor"></span></div>`;
}

// ── RESIZER ───────────────────────────────────────────────────────────────
const resizer = document.getElementById('resizer');
const panel = document.getElementById('problemPanel');
let isResizing = false;
resizer.addEventListener('mousedown', e => { isResizing = true; resizer.classList.add('dragging'); e.preventDefault(); });
document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const w = Math.max(280, Math.min(600, e.clientX));
  panel.style.width = w + 'px';
  if (cmEditor) cmEditor.refresh();
});
document.addEventListener('mouseup', () => { isResizing = false; resizer.classList.remove('dragging'); });

// ── EVENT WIRING ──────────────────────────────────────────────────────────
document.getElementById('btnRun').addEventListener('click', runCode);
document.getElementById('btnPrev').addEventListener('click', prevProblem);
document.getElementById('btnNext').addEventListener('click', nextProblem);
document.getElementById('btnClear').addEventListener('click', clearOutputView);
document.getElementById('ptabDesc').addEventListener('click', function() { switchPTab(this, 'desc'); });
document.getElementById('ptabNotes').addEventListener('click', function() { switchPTab(this, 'notes'); });
document.getElementById('otabOutput').addEventListener('click', function() { switchOTab(this, 'output'); });
document.getElementById('otabTests').addEventListener('click', function() { switchOTab(this, 'tests'); });
document.getElementById('langSelect').addEventListener('change', function() { switchLang(this.value); });

init();
